name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  migrations:
    name: postgres migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spotdonalds
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spotdonalds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations twice
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: spotdonalds
          SPOTDONALDS_CI_LOGIN: "1"
        run: bash scripts/apply-migrations.sh
      - run: npm ci
      - name: Integration tests
        env:
          DATABASE_URL: postgres://spotdonalds_app:spotdonalds_ci@127.0.0.1:5432/spotdonalds?sslmode=disable
          REQUIRE_DATABASE: "1"
        run: npx vitest run lib/db/access.integration.test.ts
